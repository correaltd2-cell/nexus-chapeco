<meta name="claude:viewport-fit-sides" content="cover">
<title>Atendimento Nexus</title>
<style>
/* Aparência de aplicativo de mensagens: cinza neutro, fonte do sistema e uma cor só (verde) para o que
   pede atenção. O tema acompanha o aparelho, e a escolha feita dentro do sistema (claro ou escuro)
   vale por cima, pelas classes t-claro e t-escuro no body. Azul, laranja e água são só dos gráficos. */
:root{
  --app:#EEF0F2; --panel:#FFFFFF; --hover:#F3F4F6; --sel:#E8EBEE; --line:#E4E7EA;
  --ink:#131B21; --ink-2:#55626B; --ink-3:#66737C;
  --wall:#EAE6DF; --in:#FFFFFF; --out:#D6F3CF; --note:#FFF2BF; --chip:#FCFCFB;
  --acc:#0C8443; --acc-ink:#096B36; --acc-soft:#DFF3E5; --on-acc:#FFFFFF;
  --link:#1763B0; --lido:#3B94DB; --danger:#C0302B;
  --av-bg:#DCE1E4; --av-fg:#55626B; --marca:#F6821F; --on-marca:#191613;
  --sombra:0 1px .5px rgba(11,20,26,.13);
  --lista:#EEF0F2; --cartao:#FFFFFF; --eixo:#C4CACF;
  --d1:#2a78d6; --d2:#eb6834; --d3:#1baf7a;
  --s0:#EEF0F2; --s1:#86b6ef; --s2:#5598e7; --s3:#2a78d6; --s4:#1c5cab; --s5:#0d366b; --s-tr:#cde2fb;
  --vd-b:#D7F0DD; --vd-f:#0B5B2E; --am-b:#FBEBB5; --am-f:#6B4E00; --lr-b:#FDDCC2; --lr-f:#8A3B00;
  --vm-b:#FBD5D2; --vm-f:#8E1F1A; --rx-b:#E4DBFA; --rx-f:#4B2C9E; --az-b:#D3E6FA; --az-f:#114E8C;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --app:#1B2227; --panel:#11181C; --hover:#1A2328; --sel:#232D34; --line:#242E35;
  --ink:#E8EDF0; --ink-2:#A3AFB7; --ink-3:#86949D;
  --wall:#0B1013; --in:#1E282E; --out:#0F4B37; --note:#3A3312; --chip:#1A2328;
  --acc:#22B365; --acc-ink:#5BD994; --acc-soft:#12351F; --on-acc:#0B1013;
  --link:#6BB9F5; --lido:#6BB9F5; --danger:#F0776F;
  --av-bg:#37424A; --av-fg:#C5CED3; --marca:#F6821F; --on-marca:#191613;
  --sombra:0 1px .5px rgba(0,0,0,.4);
  --lista:#1B2227; --cartao:#26313A; --eixo:#3A464E;
  --d1:#3987e5; --d2:#d95926; --d3:#199e70;
  --s0:#1B2227; --s1:#184f95; --s2:#256abf; --s3:#3987e5; --s4:#6da7ec; --s5:#9ec5f4; --s-tr:#0d366b;
  --vd-b:#153A25; --vd-f:#7FDCA2; --am-b:#3D3210; --am-f:#EBCB6B; --lr-b:#47280F; --lr-f:#F5A86B;
  --vm-b:#4A1C1A; --vm-f:#F29992; --rx-b:#2E2553; --rx-f:#BBA8F5; --az-b:#14324F; --az-f:#8CC3F5;
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --app:#1B2227; --panel:#11181C; --hover:#1A2328; --sel:#232D34; --line:#242E35;
  --ink:#E8EDF0; --ink-2:#A3AFB7; --ink-3:#86949D;
  --wall:#0B1013; --in:#1E282E; --out:#0F4B37; --note:#3A3312; --chip:#1A2328;
  --acc:#22B365; --acc-ink:#5BD994; --acc-soft:#12351F; --on-acc:#0B1013;
  --link:#6BB9F5; --lido:#6BB9F5; --danger:#F0776F;
  --av-bg:#37424A; --av-fg:#C5CED3; --marca:#F6821F; --on-marca:#191613;
  --sombra:0 1px .5px rgba(0,0,0,.4);
  --lista:#1B2227; --cartao:#26313A; --eixo:#3A464E;
  --d1:#3987e5; --d2:#d95926; --d3:#199e70;
  --s0:#1B2227; --s1:#184f95; --s2:#256abf; --s3:#3987e5; --s4:#6da7ec; --s5:#9ec5f4; --s-tr:#0d366b;
  --vd-b:#153A25; --vd-f:#7FDCA2; --am-b:#3D3210; --am-f:#EBCB6B; --lr-b:#47280F; --lr-f:#F5A86B;
  --vm-b:#4A1C1A; --vm-f:#F29992; --rx-b:#2E2553; --rx-f:#BBA8F5; --az-b:#14324F; --az-f:#8CC3F5;
  color-scheme:dark;
}
body.t-claro{
  --app:#EEF0F2; --panel:#FFFFFF; --hover:#F3F4F6; --sel:#E8EBEE; --line:#E4E7EA;
  --ink:#131B21; --ink-2:#55626B; --ink-3:#66737C;
  --wall:#EAE6DF; --in:#FFFFFF; --out:#D6F3CF; --note:#FFF2BF; --chip:#FCFCFB;
  --acc:#0C8443; --acc-ink:#096B36; --acc-soft:#DFF3E5; --on-acc:#FFFFFF;
  --link:#1763B0; --lido:#3B94DB; --danger:#C0302B;
  --av-bg:#DCE1E4; --av-fg:#55626B; --marca:#F6821F; --on-marca:#191613;
  --sombra:0 1px .5px rgba(11,20,26,.13);
  --lista:#EEF0F2; --cartao:#FFFFFF; --eixo:#C4CACF;
  --d1:#2a78d6; --d2:#eb6834; --d3:#1baf7a;
  --s0:#EEF0F2; --s1:#86b6ef; --s2:#5598e7; --s3:#2a78d6; --s4:#1c5cab; --s5:#0d366b; --s-tr:#cde2fb;
  --vd-b:#D7F0DD; --vd-f:#0B5B2E; --am-b:#FBEBB5; --am-f:#6B4E00; --lr-b:#FDDCC2; --lr-f:#8A3B00;
  --vm-b:#FBD5D2; --vm-f:#8E1F1A; --rx-b:#E4DBFA; --rx-f:#4B2C9E; --az-b:#D3E6FA; --az-f:#114E8C;
  color-scheme:light;
}
body.t-escuro{
  --app:#1B2227; --panel:#11181C; --hover:#1A2328; --sel:#232D34; --line:#242E35;
  --ink:#E8EDF0; --ink-2:#A3AFB7; --ink-3:#86949D;
  --wall:#0B1013; --in:#1E282E; --out:#0F4B37; --note:#3A3312; --chip:#1A2328;
  --acc:#22B365; --acc-ink:#5BD994; --acc-soft:#12351F; --on-acc:#0B1013;
  --link:#6BB9F5; --lido:#6BB9F5; --danger:#F0776F;
  --av-bg:#37424A; --av-fg:#C5CED3; --marca:#F6821F; --on-marca:#191613;
  --sombra:0 1px .5px rgba(0,0,0,.4);
  --lista:#1B2227; --cartao:#26313A; --eixo:#3A464E;
  --d1:#3987e5; --d2:#d95926; --d3:#199e70;
  --s0:#1B2227; --s1:#184f95; --s2:#256abf; --s3:#3987e5; --s4:#6da7ec; --s5:#9ec5f4; --s-tr:#0d366b;
  --vd-b:#153A25; --vd-f:#7FDCA2; --am-b:#3D3210; --am-f:#EBCB6B; --lr-b:#47280F; --lr-f:#F5A86B;
  --vm-b:#4A1C1A; --vm-f:#F29992; --rx-b:#2E2553; --rx-f:#BBA8F5; --az-b:#14324F; --az-f:#8CC3F5;
  color-scheme:dark;
}

*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.4;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h2,h3,p{margin:0}
::selection{background:var(--acc-soft)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);flex:none}
.ib:hover,.ib[aria-expanded="true"]{background:var(--sel)}
.tx-btn{border:0;background:transparent;color:var(--link);font-weight:500;padding:6px 8px;border-radius:6px;white-space:nowrap}
.tx-btn:hover{background:var(--sel)}

.wa{display:grid;grid-template-columns:380px minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);height:100%;position:relative}
.wa>*{min-width:0;min-height:0}

/* ---------- trilho ---------- */
.rail{background:var(--app);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;padding-left:env(safe-area-inset-left,0px)}
.rail .ib{position:relative}
.rail .n{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:var(--on-acc);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.eu-foto{margin-top:6px;width:32px;height:32px;border-radius:50%;background:var(--marca);color:var(--on-marca);display:grid;place-items:center;font-weight:700;font-size:16px}

/* ---------- lista ---------- */
.lst{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);position:relative}
.lh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 10px 4px 20px}
.lh b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.busca{margin:6px 14px 8px;display:flex;align-items:center;gap:10px;background:var(--app);border-radius:20px;padding:0 14px;color:var(--ink-3)}
.busca .ic{width:18px;height:18px}
.busca input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;outline:0;color:var(--ink)}
.busca input::placeholder,.cmp input::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--app);color:var(--ink-2);border-radius:16px;padding:6px 12px;white-space:nowrap}
.chip:hover{background:var(--sel)}
.chip[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc-ink)}
.chip span{margin-left:5px}
.lista{flex:1;overflow-y:auto;min-height:0}
.it{display:grid;grid-template-columns:49px minmax(0,1fr);gap:0 14px;width:100%;border:0;background:transparent;text-align:left;padding:0 14px;align-items:center}
.it:hover{background:var(--hover)}
.it[aria-current="true"]{background:var(--sel)}
.it .bd{display:block;min-width:0;padding:11px 0 12px;border-bottom:1px solid var(--line)}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.l1 b{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l1 time{font-size:12px;color:var(--ink-3);flex:none}
.it.nl .l1 time{color:var(--acc-ink);font-weight:500}
.l2{display:flex;gap:4px;align-items:center;color:var(--ink-2);margin-top:1px;min-height:21px}
.l2 .pv{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.nl .l2 .pv{color:var(--ink)}
.bdg{background:var(--acc);color:var(--on-acc);border-radius:10px;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.l3{display:flex;gap:12px;margin-top:2px;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.l3 .rt{display:inline-flex;align-items:center;gap:4px}
.l3 .ic{width:13px;height:13px}
.rodape{padding:18px 20px 24px;color:var(--ink-3);font-size:12.5px;text-align:center}
.vazio{padding:32px 24px;color:var(--ink-3);text-align:center}
.av{width:49px;height:49px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;background:var(--av-bg);color:var(--av-fg);font-weight:500;font-size:17px}
.av img{width:100%;height:100%;display:block;object-fit:cover}
.av.s{width:40px;height:40px;font-size:14.5px}
.av.l{width:120px;height:120px;font-size:42px;font-weight:400}

/* ---------- conversa ---------- */
.cht{display:flex;flex-direction:column;background:var(--wall);position:relative}
.sem{margin:auto;text-align:center;color:var(--ink-3);padding:24px;max-width:340px}
.ch{display:flex;align-items:center;gap:4px;padding:0 12px 0 16px;background:var(--app);border-bottom:1px solid var(--line);height:60px;flex:none}
.volta{display:none;margin-left:-8px}
.cab-btn{display:flex;align-items:center;gap:14px;flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;height:100%}
.cab-btn b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-btn small{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-btn>span:last-child{min-width:0}
.abre{display:none}
.rolo{flex:1;overflow-y:auto;min-height:0;padding:10px clamp(16px,6%,72px) 12px;display:flex;flex-direction:column}
.cp{align-self:center;margin:10px 0 4px;max-width:88%;text-align:center;background:var(--chip);color:var(--ink-2);font-size:12.5px;padding:5px 12px;border-radius:7.5px;box-shadow:var(--sombra)}
.w{display:flex;flex-direction:column;gap:2px;max-width:min(74%,520px);margin-top:2px}
.w.p{margin-top:10px}
.w.in{align-self:flex-start}
.w.out{align-self:flex-end}
.b{position:relative;padding:6px 8px 7px 9px;border-radius:7.5px;font-size:14.2px;line-height:19px;overflow-wrap:anywhere;box-shadow:var(--sombra);background:var(--in)}
.w.out .b{background:var(--out)}
.w.nota .b{background:var(--note)}
.w.in.p .b{border-top-left-radius:0}
.w.out.p .b{border-top-right-radius:0}
.w.p .b::before{content:"";position:absolute;top:0;width:8px;height:12px;background:inherit}
.w.in.p .b::before{left:-8px;clip-path:polygon(0 0,100% 0,100% 100%)}
.w.out.p .b::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.b .nm{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:1px}
.b .tx{white-space:pre-wrap}
.b .mt{float:right;margin:5px 0 -4px 12px;font-size:11px;line-height:15px;color:var(--ink-2);display:inline-flex;align-items:center;gap:3px}
.tk{width:16px;height:11px;fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tk.lido{stroke:var(--lido)}
.bts{display:flex;flex-direction:column;gap:2px}
.bts>*{border:0;border-radius:7.5px;background:var(--out);box-shadow:var(--sombra);padding:9px 12px;text-align:center;color:var(--link);font-weight:500;font-size:14px}
.bts button:hover{filter:brightness(.97)}
.dig{color:var(--ink-2)}
.md{display:block;margin:-2px -4px 5px -5px;border-radius:6px;overflow:hidden}
.md-video{width:260px;max-width:100%;aspect-ratio:16/9;background:#1D262C;display:grid;place-items:center;position:relative;color:#fff}
.md-video svg{width:54px;height:54px}
.md-video span{position:absolute;left:8px;bottom:6px;font-size:11.5px}
.md-doc{display:flex;gap:12px;align-items:center;background:rgba(11,20,26,.06);padding:11px 12px;min-width:230px}
.md-doc .ic{width:28px;height:28px;color:var(--ink-3);stroke-width:1.3}
.md-doc b{display:block;font-weight:500}
.md-doc small{color:var(--ink-2);font-size:12px}
.md-img img{display:block;max-width:260px;width:100%;height:auto}

.fx{display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px 6px 16px;font-size:13.5px;color:var(--ink-2);flex:none}
.fx p{flex:1 1 180px;min-width:0}
.fx .ops{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.fx .ib{width:32px;height:32px}
.fx .ib .ic{width:18px;height:18px}
.cmp{display:flex;gap:6px;align-items:center;padding:9px 12px;background:var(--app);flex:none}
.cmp input{flex:1;min-width:0;border:0;background:var(--panel);border-radius:8px;padding:10px 14px;outline:0;font-size:15px}
.cmp.nota input{background:var(--note)}
.pe{display:flex;gap:4px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 12px 11px 16px;background:var(--app);color:var(--ink-2);flex:none;min-height:60px}
.pe p{flex:1 1 220px;min-width:0}
.pe .ops{display:flex;gap:2px;flex-wrap:wrap}

.pop{position:absolute;z-index:30;background:var(--panel);border-radius:12px;padding:8px 0;box-shadow:0 2px 5px rgba(11,20,26,.26),0 2px 10px rgba(11,20,26,.16);min-width:240px;max-width:calc(100% - 24px)}
.pop.topo{top:54px;right:12px}
.pop.base{bottom:62px;left:12px}
.pop button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 20px;font-size:14.5px}
.pop button:hover{background:var(--hover)}
.pop button small{display:block;color:var(--ink-3);font-size:12.5px}
.pop button:disabled{color:var(--ink-3);cursor:default;background:transparent}
.pop .pt{padding:6px 20px 6px;font-size:13px;color:var(--ink-3)}

/* ---------- dados do contato ---------- */
.pnl{border-left:1px solid var(--line);background:var(--app);overflow-y:auto;padding-right:env(safe-area-inset-right,0px)}
.ph{display:flex;align-items:center;gap:14px;padding:0 16px 0 24px;height:60px;background:var(--app);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;font-size:16px;font-weight:500}
.ph .ib{display:none;margin-left:-16px}
.bl{background:var(--panel);margin-bottom:8px;padding:6px 0}
.cab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:26px 24px 18px;text-align:center}
.cab h2{font-size:21px;font-weight:500;margin-top:12px}
.cab span{color:var(--ink-2);font-size:15px}
.cab .tx-btn{margin-top:6px;font-size:13.5px}
.bt{padding:10px 24px 4px;font-size:13.5px;color:var(--ink-3)}
.ar{display:grid;grid-template-columns:24px auto minmax(0,1fr) 18px;gap:0 16px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:12px 16px 12px 24px;font-size:15px}
.ar:hover{background:var(--hover)}
.ar .ic{color:var(--ink-3);width:22px;height:22px}
.ar .al{white-space:nowrap}
.ar .am{color:var(--ink-3);font-size:13.5px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ar .cv{width:18px;height:18px;transition:transform .15s}
.ar[aria-expanded="true"] .cv{transform:rotate(90deg)}
.ar:disabled{cursor:default}
.ar:disabled:hover{background:transparent}
.ar:disabled .al{color:var(--ink-3)}
.ar.perigo,.ar.perigo .ic{color:var(--danger)}
.ax{padding:0 16px 10px 56px}
.sr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:8px 8px;border-radius:6px;font-size:14.5px}
.sr:hover{background:var(--hover)}
.sr small{color:var(--ink-3);font-size:12.5px;text-align:right}
.sr:disabled{cursor:default;color:var(--ink-3)}
.sr:disabled:hover{background:transparent}
.cx{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;min-width:0;width:100%;outline:0}
.cx:focus{border-color:var(--ink-3)}
.ln{display:flex;gap:6px;margin:6px 0}
.ln .cx{flex:1}
.obs{font-size:12.5px;color:var(--ink-3);padding:4px 8px 0}
.obs.forte{font-size:14px;color:var(--ink);padding:0 8px 6px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;margin:0;padding:6px 24px 12px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;text-align:right}
.pc{display:flex;justify-content:space-between;gap:12px;padding:7px 24px}
.pc small{display:block;color:var(--ink-3);font-size:12.5px}
.pc .v{text-align:right}
.pc .at{color:var(--danger)}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:2px 8px 4px}
.tag{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 11px;font-size:13px;color:var(--ink-2)}
.tag[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.nota-i{background:var(--note);border-radius:7.5px;padding:7px 10px;margin:0 8px 6px;font-size:13.5px}
.nota-i small{display:block;color:var(--ink-2);font-size:12px}
.hist{list-style:none;margin:0;padding:4px 24px 12px}
.hist li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:5px 0}
.hist li span:first-child{color:var(--ink-3)}
.sem-hist{padding:4px 24px 12px;color:var(--ink-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;z-index:90;width:max-content;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.on{opacity:1}

/* ---------- larguras ---------- */
@media (max-width:1179px){
  .wa{grid-template-columns:340px minmax(0,1fr)}
  .pnl{position:absolute;top:0;right:0;bottom:0;width:min(360px,100%);z-index:40;display:none;box-shadow:-12px 0 32px -18px rgba(0,0,0,.45)}
  .wa.p-open .pnl{display:block}
  .ph .ib{display:grid}
  .abre{display:grid}
}
@media (max-width:759px){
  .wa{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .lst{border-right:0}
  .cht{display:none}
  .wa.c-open .lst{display:none}
  .wa.c-open .cht{display:flex}
  .wa.p-open .cht{display:none}
  .pnl{position:static;width:auto;box-shadow:none;border-left:0}
  .volta{display:grid}
  .abre{display:none}
  .lh{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  .busca{margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
  .chips,.it,.rodape,.rolo{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ch,.fx,.pe{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .ph{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cmp{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .w{max-width:86%}
  .ch .ib{width:36px}
  input,select{font-size:16px}
}

/* ================= casca do sistema ================= */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
.views{min-width:0;min-height:0;position:relative}
.view{height:100%;min-width:0;min-height:0;position:relative}
.rail .ib[aria-current="page"]{background:var(--sel);color:var(--ink)}
.rail .sp{flex:1}
.tabs{display:none}
.vh{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;min-height:60px;padding:8px 16px 8px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;position:relative}
.vh h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 6px 0 0}
.vh .fim{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--hover)}
.btn .ic{width:18px;height:18px}
.btn[aria-expanded="true"]{background:var(--sel)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.p:hover{background:var(--acc);filter:brightness(.94)}
.btn .q{background:var(--acc);color:var(--on-acc);border-radius:9px;min-width:18px;height:18px;font-size:11.5px;display:grid;place-items:center;padding:0 5px}
.seg{display:inline-flex;background:var(--app);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:var(--sombra)}
textarea{font:inherit;color:inherit}
textarea.cx{display:block;resize:vertical;min-height:76px;line-height:1.4}
.lbp{display:inline-block;font-size:12px;font-weight:500;line-height:18px;padding:0 8px;border-radius:4px;white-space:nowrap}
.lb-vd{background:var(--vd-b);color:var(--vd-f)}
.lb-am{background:var(--am-b);color:var(--am-f)}
.lb-lr{background:var(--lr-b);color:var(--lr-f)}
.lb-vm{background:var(--vm-b);color:var(--vm-f)}
.lb-rx{background:var(--rx-b);color:var(--rx-f)}
.lb-az{background:var(--az-b);color:var(--az-f)}
.sr.emp{flex-direction:column;align-items:flex-start;gap:1px}
.sr.emp small{text-align:left}
.fict{color:var(--ink-3);font-size:12.5px;text-align:center;padding:18px 20px 6px}

/* ================= quadros ================= */
.qd{display:flex;flex-direction:column;height:100%;background:var(--panel);position:relative}
.qd-abas{padding:0;flex:1 1 240px;min-width:0}
.qd-abas form{display:flex;gap:4px;flex:none}
.qd-abas .cx{width:168px;padding:5px 12px;border-radius:16px}
.qd-abas .tx-btn{flex:none}
.qd-tela{flex:1;min-height:0;display:flex;gap:12px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding:16px 20px 14px}
.kl{flex:none;width:284px;max-height:100%;display:flex;flex-direction:column;background:var(--lista);border-radius:12px;position:relative}
.kl-h{display:flex;align-items:center;gap:4px;padding:8px 4px 4px 8px;min-height:44px;flex:none}
.kl-n{flex:1;min-width:0;border:0;background:transparent;text-align:left;font-weight:600;font-size:14.5px;padding:5px 6px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kl-n:hover{background:var(--sel)}
.kl-h .cx{flex:1;padding:4px 6px;font-weight:600;font-size:14.5px}
.kl-h .q{color:var(--ink-3);font-size:13px;padding:0 4px}
.kl-h .ib{width:32px;height:32px}
.kl-h .ib .ic{width:18px;height:18px}
.kl-cs{flex:1;min-height:6px;overflow-y:auto;padding:2px 8px;display:flex;flex-direction:column;gap:8px}
.kc{display:block;width:100%;flex:none;text-align:left;border:0;background:var(--cartao);border-radius:8px;padding:9px 10px 8px;box-shadow:var(--sombra);font-size:14.5px;line-height:1.35}
.kc:hover{box-shadow:var(--sombra),0 0 0 1.5px var(--ink-3)}
.kc.arr{opacity:.35}
.kph{height:38px;border-radius:8px;background:var(--sel);flex:none}
.kc-lb{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.kc-t{display:block;overflow-wrap:anywhere}
.kc-m{display:flex;gap:4px 10px;align-items:center;margin-top:7px;color:var(--ink-3);font-size:12.5px;flex-wrap:wrap;min-height:22px}
.kc-m>span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.kc-m .ic{width:14px;height:14px}
.kc-m .atr{color:var(--danger);font-weight:500}
.kc-m .ok{color:var(--acc-ink)}
.kc-m .nv{color:var(--acc-ink);font-weight:500}
.mini{width:16px;height:16px;border-radius:50%;background:var(--av-bg);color:var(--av-fg);font-size:8.5px;font-weight:600;font-style:normal;display:inline-grid;place-items:center;margin-right:2px}
.mbs{margin-left:auto;display:inline-flex;padding-left:4px}
.mb{width:22px;height:22px;border-radius:50%;background:var(--av-bg);color:var(--av-fg);font-size:10.5px;font-weight:600;font-style:normal;display:grid;place-items:center;margin-left:-5px;box-shadow:0 0 0 2px var(--cartao)}
.kl-f{padding:6px 8px 8px;flex:none}
.kl-add{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;color:var(--ink-2);padding:7px 8px;border-radius:8px;text-align:left}
.kl-add:hover{background:var(--sel);color:var(--ink)}
.kl-add .ic{width:18px;height:18px}
.kl-form{display:flex;flex-direction:column;gap:6px}
.kl-form .ops{display:flex;gap:4px;align-items:center}
.kl-form .ib{width:32px;height:32px}
.kl-form .ib .ic{width:18px;height:18px}
.kl.nova{background:var(--hover)}
.kl.nova .kl-f{padding-top:8px}
.kl .pop{top:42px;right:6px}
.kvz{color:var(--ink-3);font-size:13px;padding:4px 6px 8px}
.fp{position:absolute;top:56px;right:16px;z-index:30;background:var(--panel);border-radius:12px;box-shadow:0 2px 5px rgba(11,20,26,.26),0 2px 10px rgba(11,20,26,.16);padding:14px;width:320px;max-width:calc(100% - 24px);max-height:calc(100% - 72px);overflow-y:auto}
.fp h3{font-size:13px;font-weight:400;color:var(--ink-3);margin:12px 0 6px}
.fp .tags{padding:0}
.fp .sr{padding-left:4px;padding-right:4px}
.fp .rodape-f{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.fp .arq{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0}
.fp .arq span{min-width:0;overflow-wrap:anywhere}
.fp .arq small{display:block;color:var(--ink-3);font-size:12.5px}
.qd .pop.topo{top:54px;right:16px}

/* cartão aberto */
.mod{position:absolute;inset:0;z-index:60;background:rgba(11,20,26,.5);overflow-y:auto;padding:36px 16px;display:flex;justify-content:center;align-items:flex-start}
.mod-c{width:min(800px,100%);background:var(--panel);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.32);outline:0}
.mod-h{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:0 8px;padding:14px 12px 8px 24px;align-items:center}
.mod-h input{border:0;background:transparent;font-size:20px;font-weight:600;padding:5px 8px;margin-left:-8px;border-radius:6px;outline:0;min-width:0;width:100%}
.mod-h input:hover,.mod-h input:focus{background:var(--app)}
.mod-h p{grid-column:1/-1;color:var(--ink-3);font-size:13.5px}
.mod-b{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:28px;padding:10px 24px 24px}
.ms{margin-bottom:22px}
.ms:last-child{margin-bottom:0}
.ms h3{font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.ms h3 span{font-weight:400;color:var(--ink-3)}
.ms .tags{padding:0}
.mc{display:flex;gap:12px;align-items:center;background:var(--app);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.mc .mc-t{flex:1 1 160px;min-width:0}
.mc b{display:block;font-weight:500}
.mc small{display:block;color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms .lnk{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.pg{height:6px;border-radius:3px;background:var(--app);overflow:hidden;margin-bottom:6px}
.pg i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .2s}
.ci{display:flex;gap:10px;align-items:flex-start;padding:5px 4px;border-radius:6px}
.ci:hover{background:var(--hover)}
.ci input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--acc);flex:none}
.ci span{flex:1;min-width:0;overflow-wrap:anywhere}
.ci.ok span{color:var(--ink-3);text-decoration:line-through}
.ci .ib{width:26px;height:26px;margin:-3px 0}
.ci .ib .ic{width:15px;height:15px}
.atv{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.atv li{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.atv li.cm{background:var(--app);border-radius:8px;padding:7px 10px;color:var(--ink)}
.atv small{color:var(--ink-3);font-size:12px;margin-left:6px;white-space:nowrap}
.atv b{font-weight:600;color:var(--ink)}
.lbt{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px}
.lbt[aria-pressed="false"]{background:transparent;color:var(--ink-2)}
.lbt[aria-pressed="false"]:hover{background:var(--hover)}
.lbt[aria-pressed="true"]{border-color:transparent}
.ms .ln{margin:8px 0 0}
.ms .cx+.ci{margin-top:6px}
.arq-b{border:0;background:transparent;color:var(--danger);padding:7px 8px;border-radius:6px;font-weight:500;margin-left:-8px}
.arq-b:hover{background:var(--hover)}

/* ================= relatórios ================= */
.rl{display:flex;flex-direction:column;height:100%;background:var(--app)}
.rl .chips{padding:0;flex:1 1 200px;min-width:0}
.rl-rolo{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 12px}
.rl-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1240px;margin:0 auto}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border-radius:10px;padding:14px 18px 13px;min-width:0}
.kpi span{display:block;color:var(--ink-2);font-size:13.5px}
.kpi b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:5px 0 3px}
.kpi small{display:block;font-size:12.5px;color:var(--ink-3)}
.kpi small.bom{color:var(--acc-ink)}
.kpi small.ruim{color:var(--danger)}
.kpi .tx-btn{padding:0;font-size:12.5px}
.kpi .tx-btn:hover{background:transparent;text-decoration:underline}
.cd{background:var(--panel);border-radius:10px;padding:16px 18px 16px;min-width:0}
.cd.tudo{grid-column:1/-1}
.pilha{display:flex;flex-direction:column;gap:12px;min-width:0}
.pilha .cd:last-child{flex:1}
.cd-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.cd-h h3{font-size:15px;font-weight:600}
.cd-h p{color:var(--ink-3);font-size:13px;margin-top:1px}
.cd-h .tx-btn{font-size:13px;margin:-5px -8px 0 0;flex:none}
.gx{display:block;border-radius:4px;max-width:100%}
.gx:focus-visible{outline-offset:3px}
.gr{stroke:var(--line);stroke-width:1}
.gr.bs{stroke:var(--eixo)}
.tx-e{font-size:11.5px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.tx-v{font-size:12px;fill:var(--ink);font-weight:600}
.hit{fill:transparent}
.bar{fill:var(--d1)}
.cols .mk:hover .hit,.cols .mk.on .hit{fill:var(--hover)}
.mk:hover .bar,.mk.on .bar{filter:brightness(1.14)}
.ln-p{fill:none;stroke:var(--d1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cr{stroke:var(--ink-3);stroke-width:1;opacity:0}
.pt{fill:var(--d1);stroke:var(--panel);stroke-width:2;opacity:0}
.mk:hover .cr,.mk.on .cr,.mk:hover .pt,.mk.on .pt{opacity:1}
.pt.fim{opacity:1}
.mt-l{stroke:var(--ink-3);stroke-width:1}
.hm{display:grid;grid-template-columns:30px repeat(14,minmax(0,1fr));gap:2px;align-items:center}
.hm i{display:block;height:22px;border-radius:3px;background:var(--s0)}
.hm .b1,.hm-lg .b1{background:var(--s1)}
.hm .b2,.hm-lg .b2{background:var(--s2)}
.hm .b3,.hm-lg .b3{background:var(--s3)}
.hm .b4,.hm-lg .b4{background:var(--s4)}
.hm .b5,.hm-lg .b5{background:var(--s5)}
.hm i:hover,.hm i.on{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--ink)}
.hm-h{font-size:11px;color:var(--ink-3);text-align:center;padding-bottom:2px}
.hm-d{font-size:12px;color:var(--ink-3)}
.hm-lg{display:flex;gap:3px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--ink-3)}
.hm-lg i{width:18px;height:10px;border-radius:2px}
.hm-lg span{padding:0 4px}
.bh{--lw:150px;--gp:10px;position:relative;display:flex;flex-direction:column;gap:9px}
.bh.meta{padding-top:20px}
.bh-r{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);gap:var(--gp);align-items:center;border-radius:4px}
.bh-l{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bh-t{display:flex;align-items:center;gap:7px;padding-right:58px;border-left:1px solid var(--eixo)}
.bh-t i{display:block;height:16px;min-width:2px;border-radius:0 4px 4px 0;background:var(--d1);flex:none}
.bh-t b{font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--panel);position:relative;z-index:1;padding:0 3px;margin-left:-3px}
.bh-r:hover i,.bh-r.on i{filter:brightness(1.14)}
.bh-m{position:absolute;top:16px;bottom:0;left:calc(var(--lw) + var(--gp) + (100% - var(--lw) - var(--gp) - 58px) * var(--f));border-left:1px solid var(--ink-3);pointer-events:none}
.bh-m span{position:absolute;top:-17px;left:0;transform:translateX(-50%);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.sg{display:flex;gap:2px;height:28px}
.sg span{display:flex;align-items:center;min-width:0;border-radius:4px;padding-left:8px;color:#fff;font-size:12.5px;font-weight:600;overflow:visible;white-space:nowrap}
.sg span:hover,.sg span.on{filter:brightness(1.12)}
.sg .p1{background:var(--d1)}
.sg .p2{background:var(--d2)}
.sg .p3{background:var(--d3)}
.lg{list-style:none;display:flex;gap:6px 18px;flex-wrap:wrap;margin:12px 0 0;padding:0;font-size:13px;color:var(--ink-2)}
.lg li{display:flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:2px;flex:none}
.lg .p1{background:var(--d1)}
.lg .p2{background:var(--d2)}
.lg .p3{background:var(--d3)}
.mts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 28px}
.mtr span{display:block;font-size:13.5px;color:var(--ink-2)}
.mtr b{display:block;font-size:20px;font-weight:600;margin:3px 0 7px;letter-spacing:-.01em}
.mtr .tr{height:8px;border-radius:4px;background:var(--s-tr);overflow:hidden}
.mtr .tr i{display:block;height:100%;border-radius:4px;background:var(--d1)}
.mtr small{display:block;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.tb-w{overflow-x:auto;max-height:268px;overflow-y:auto}
.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:6px 14px 6px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);white-space:nowrap}
.tb td{padding:8px 14px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tb tr:last-child td{border-bottom:0}
.tb.larga{min-width:560px}
.tb .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb th:last-child,.tb td:last-child{padding-right:0}
.tip{position:fixed;z-index:95;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--panel);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.35;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;font-size:14px;font-weight:600}
.tip span{opacity:.82}

/* ================= configurações ================= */
.aj{display:grid;grid-template-columns:380px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
.aj>*{min-width:0;min-height:0}
.aj-n{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
.aj-n .lh{padding-bottom:10px;min-height:54px}
.sn{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 14px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:0 14px 0 20px}
.sn:hover{background:var(--hover)}
.sn[aria-current="true"]{background:var(--sel)}
.sn .ico{width:40px;height:40px;border-radius:50%;background:var(--app);display:grid;place-items:center;color:var(--ink-2)}
.sn[aria-current="true"] .ico{background:var(--panel)}
.sn .ico .ic{width:21px;height:21px}
.sn .bd{display:block;padding:13px 0 14px;border-bottom:1px solid var(--line);min-width:0}
.sn b{display:block;font-weight:500;font-size:16px}
.sn small{display:block;color:var(--ink-2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aj-c{display:flex;flex-direction:column;background:var(--app)}
.aj-c .ch b{font-size:16px;font-weight:500}
.aj-b{flex:1;min-height:0;overflow-y:auto;padding:0 0 12px}

function situ(c){
  if(c.st==='fim') return SET[c.q].n+', encerrada';
  if(c.q==='rec') return 'Recepção';
  if(c.q==='fin') return c.st==='ia'?'Financeiro, com a IA':'Financeiro';
  const s=SET[c.q];
  return s.n+(c.st==='aguarda'?', aguardando '+s.art+' '+s.quem:', com '+s.art+' '+s.quem);
}

function visiveis(){
  let l=CONVS.filter(c=>{
    if(S.f==='enc') return c.st==='fim';
    if(c.st==='fim') return false;
    if(S.f==='todas') return true;
    if(S.f==='nl') return c.unread>0;
    if(S.f==='ret') return !!c.retorno;
    return c.q===S.f;
  });
  const q=S.q.trim().toLowerCase(), qd=q.replace(/\D/g,'');
  if(q) l=l.filter(c=>c.nome.toLowerCase().includes(q)||(qd&&c.tel.replace(/\D/g,'').includes(qd)));
  return l.sort((a,b)=>b.ts-a.ts);
}
function renderChips(){
  const ab=CONVS.filter(c=>c.st!=='fim');

    .concat([['ret','Retornos',ab.filter(c=>c.retorno).length],['enc','Encerradas',0]]);
  const cx=$('#chips');
  cx.innerHTML=C.map(c=>'<button class="chip" data-act="filtro" data-f="'+c[0]+'" aria-pressed="'+(S.f===c[0])+'">'+c[1]+(c[2]?'<span class="num">'+c[2]+'</span>':'')+'</button>').join('');
  const pr=cx.querySelector('[aria-pressed="true"]');
  if(pr){ const x=pr.offsetLeft-cx.offsetLeft; if(x<cx.scrollLeft||x+pr.offsetWidth>cx.scrollLeft+cx.clientWidth) cx.scrollLeft=Math.max(0,x-14); }
  const nn=ab.filter(c=>c.unread>0).length;
  ['#navN','#navN2'].forEach(s=>{ const b=$(s); b.hidden=!nn; b.textContent=nn; });
}

function midia(md){
  if(md.k==='video') return '<span class="md md-video"><svg><use href="#i-play"/></svg>'+(md.d?'<span class="num">'+esc(md.d)+'</span>':'')+'</span>';
  if(md.k==='img') return '<span class="md md-img"><img src="'+md.src+'" alt="'+esc(md.n)+'"></span>';
  return '<span class="md md-doc">'+ic('doc')+'<span><b>'+esc(md.n)+'</b><small>'+md.d+'</small></span></span>';
}
function corpoHTML(c){
  const ativa=c.q==='fin'&&c.st==='ia'&&!c.busy;
  let h=c.msgs[0].f==='dia'?'':'<div class="cp">Hoje</div>', ant=null;
  c.msgs.forEach((m,i)=>{
    if(m.f==='dia'||m.f==='sys'){ h+='<div class="cp">'+esc(m.x)+'</div>'; ant=null; return; }
    if(m.f==='aviso'){ h+='<div class="cp" title="'+esc(m.x)+'">'+m.quem+' recebeu o aviso no WhatsApp às '+m.t+'. '+(m.aberto?'Abriu o portal às '+m.aberto+'.':'Ainda não abriu o portal.')+'</div>'; ant=null; return; }
    if(m.f==='nota'){ h+='<div class="w out nota p"><div class="b"><span class="nm">Nota interna de '+m.by+'</span><span class="tx">'+esc(m.x)+'</span><span class="mt num">'+m.t+'</span></div></div>'; ant=null; return; }
    const lado=m.f==='in'?'in':'out', k=lado+(m.by||''), prim=k!==ant; ant=k;
    let b='';
    if(lado==='out'&&(prim||m.modelo)) b+='<span class="nm">'+(m.by==='IA'?'Financeiro (IA)':m.by)+(m.modelo?', modelo aprovado':'')+'</span>';
    if(m.media) b+=midia(m.media);
    if(m.x) b+='<span class="tx">'+esc(m.x)+'</span>';
    b+='<span class="mt num">'+m.t+ticks(m)+'</span>';
    h+='<div class="w '+lado+(prim?' p':'')+'"><div class="b">'+b+'</div>';
    if(m.btn){ const on=ativa&&i===c.msgs.length-1; h+='<div class="bts">'+m.btn.map(x=>on?'<button data-act="toque" data-b="'+esc(x)+'">'+esc(x)+'</button>':'<span>'+esc(x)+'</span>').join('')+'</div>'; }
    h+='</div>';
  });
  if(c.busy) h+='<div class="w out"><div class="b dig">digitando…</div></div>';
  return h;
}

  if(c.st==='aguarda'){

    fx='<div class="fx"><p>'+(meu?'Esta conversa espera a sua resposta.':'Aguardando '+s.art+' '+s.quem+' responder pelo portal.')+'</p>'+(meu?'':'<div class="ops"><button class="tx-btn" data-act="reaviso">'+(s.avisa?'Avisar de novo':'Avisar no WhatsApp')+'</button></div>')+'</div>';

      +(c.sug.k==='transf'?'<button class="tx-btn" data-act="transf" data-q="'+c.sug.q+'">'+c.sug.l+'</button>'
        :c.ficha.turmas.map((t,i)=>'<button class="tx-btn" data-act="aula" data-i="'+i+'">'+t.l+'</button>').join(''))
      +'<button class="ib" data-act="sugx" title="Dispensar" aria-label="Dispensar a sugestão">'+ic('x')+'</button></div></div>';
  }
  let pe;
  if(c.st==='fim') pe='<div class="pe"><p>Atendimento encerrado. Uma mensagem nova do contato reabre a conversa na Recepção.</p><div class="ops"><button class="tx-btn" data-act="reabrir">Reabrir</button></div></div>';

function render(){
  const vc=$('#v-conversas'), a=document.activeElement, id=a&&a.id&&a.id!=='q'?a.id:null, val=id?a.value:null, fc=id?null:guardaFoco(vc);

  if(id){const n=document.getElementById(id); if(n&&n.type!=='file'){ if(id!=='msg'&&val!=null) n.value=val; n.focus(); }}
  else devolveFoco(vc,fc);
}

/* ================= a IA do financeiro ================= */
function fala(c,lista,fim){
  c.busy=true; render(); let i=0;
  (function passo(){
    setTimeout(function(){
      if(c.q!=='fin'||c.st!=='ia'){ c.busy=false; render(); return; }
      if(i<lista.length){ push(c,Object.assign({f:'out',by:'IA',t:hora(),tick:'entregue'},lista[i++])); render(); passo(); }
      else { c.busy=false; if(fim) fim(); render(); }
    }, i<lista.length?620:60);
  })();
}
function paraRecepcao(c,resumo,tag){
  c.q='rec'; c.st='aberta'; if(tag&&!c.tags.includes(tag)) c.tags.push(tag);
  push(c,{f:'sys',x:'A IA devolveu para a Recepção: '+resumo});
  if(tag==='Cancelamento'&&CFG.autoCard&&!cartoesDe(c.id).some(x=>x.b.id==='canc')){
    const k=criarCartao('canc',0,{t:c.nome+': '+resumo.split('. Motivo')[0].split(' e ').pop(),conv:c.id,lb:ETIQ.includes('Cancelamento')?['Cancelamento']:[],d:'A IA devolveu para a Recepção: '+resumo});
    if(k){ k.card.at.push({by:'IA',x:'criou o cartão a partir da conversa',t:hora(),s:++ASEQ}); c.msgs.push({f:'sys',x:'Cartão criado no quadro '+k.b.n+', em '+k.l.n}); }
  }
  c.unread=(S.conv===c.id&&S.eu==='rec'&&V==='conversas')?0:1;
}
function situacao(c){return c.ficha.parc.filter(x=>x.st!=='paga').slice().reverse().map(x=>x.ref+': '+brl(x.v)+(x.st==='atrasada'?', em atraso desde '+x.venc:', vence '+x.venc)).join('\n')}
function iaAbre(c){ fala(c,[{x:CFG.iaOi.replace('{nome}',pn(c)),btn:MENU_FIN.slice()}]); }
function motivo(c){const m=c.msgs.filter(x=>x.f==='in'&&x.x.length>24);return m.length?'"'+corta(m[0].x,64)+'"':'não informado'}
const ALIAS={'2ª via do boleto':'#via','Minha situação':'#sit','Cancelamento':'#canc'};
function iaResponde(c,rot){
  push(c,{f:'in',x:rot,t:hora()});
  const op=['#via','#sit','#canc'][MENU_FIN.indexOf(rot)]||ALIAS[rot]||rot;
  const p=pend(c), atr=c.ficha.parc.some(x=>x.st==='atrasada');
  const equipe=(resumo,tag)=>fala(c,[{x:'Combinado, '+pn(c)+'. Já passei pra nossa equipe com o resumo do que conversamos. Eles te respondem por aqui.'}],()=>paraRecepcao(c,resumo,tag));
  switch(op){
    case '#via':
      if(!p){ fala(c,[{x:'Consultei aqui e você não tem mensalidade em aberto. Posso te ajudar em algo mais?',btn:[SIM,NAO]}]); break; }
      fala(c,[{x:'Aqui está a 2ª via da mensalidade de '+p.ref+': '+brl(p.v)+', vencimento '+p.venc+'.',media:{k:'pdf',n:'boleto-'+p.ref.toLowerCase().replace('/','-')+'.pdf',d:'PDF, 86 KB'}},{x:'Se preferir, o Pix copia e cola:\n'+PIX},{x:'Posso te ajudar em algo mais?',btn:[SIM,NAO]}]); break;
    case '#sit':
      fala(c,[{x:(p?'Sua situação hoje:\n'+situacao(c):'Está tudo em dia, sem mensalidade em aberto.')+'\nComo posso te ajudar?',btn:atr?[MENU_FIN[0],'Quero parcelar','Falar com alguém']:[MENU_FIN[0],SIM,NAO]}]); break;
    case '#canc':
      fala(c,[{x:CFG.cancelTxt.replace('{nome}',pn(c))},
        {x:CFG.video.n,media:{k:'video',d:CFG.video.d}},
        {x:'Depois de ver, me conta como prefere seguir:',btn:['Trancar o curso','Trocar de horário','Quero cancelar']}]); break;
    case 'Trancar o curso': equipe('viu a explicação do cancelamento e quer trancar o curso. Motivo: '+motivo(c)+'.','Cancelamento'); break;
    case 'Trocar de horário': equipe('viu a explicação do cancelamento e aceita trocar de horário. Motivo: '+motivo(c)+'.','Cancelamento'); break;
    case 'Quero cancelar': equipe('viu a explicação e o vídeo e quer seguir com o cancelamento. Motivo: '+motivo(c)+'.','Cancelamento'); break;
    case 'Quero parcelar': equipe('tem mensalidade em atraso e quer parcelar.','Atraso'); break;
    case 'Falar com alguém': equipe('pediu para falar com uma pessoa sobre o financeiro.'); break;
    case SIM: fala(c,[{x:'Claro! Sobre o que você quer falar?',btn:MENU_FIN.slice()}]); break;
    default: fala(c,[{x:'Combinado! Qualquer coisa é só chamar.'}],()=>{c.st='fim';push(c,{f:'sys',x:'Atendimento encerrado pela IA'});});
  }
}

/* ================= ações ================= */
function avisar(c){
  const s=SET[c.q];
  push(c,{f:'aviso',quem:s.quem,t:hora(),x:s.quem+', tem uma conversa esperando você na Central Nexus. '+c.nome+', '+c.sub+': "'+corta(doCliente(c),70)+'". Toque no link para responder pelo portal.'});
}
function transferir(c,q){
  if(q===c.q&&c.st!=='fim') return;
  c.q=q; c.sug=null; S.pop=null;
  push(c,{f:'sys',x:EU[S.eu]+' transferiu para '+SET[q].n});
  if(q==='fin'&&CFG.iaFin){ c.st='ia'; toast('Transferido. A IA do financeiro assumiu.'); iaAbre(c); return; }
  if(q==='fin'){ c.st='aberta'; toast('Transferido para o Financeiro. A IA está desligada, a equipe atende.'); }
  else if(q==='rec'){ c.st='aberta'; toast('Conversa de volta na Recepção'); }
  else { c.st='aguarda'; if(SET[q].avisa){ avisar(c); toast(SET[q].quem+' recebeu o aviso no WhatsApp'); } else toast('Transferido para '+SET[q].n+', sem aviso no WhatsApp'); }
  render();
}
function marcaAberto(c){ if(c&&SET[c.q].quem===EU[S.eu]){ const a=c.msgs.slice().reverse().find(m=>m.f==='aviso'&&!m.aberto); if(a) a.aberto=hora(); } }
function abrir(id){
  S.conv=id; S.pop=null; S.menu=false; S.nota=false; S.draft='';
  const c=cur(); c.unread=0; marcaAberto(c);
  $('#wa').classList.add('c-open'); $('#wa').classList.remove('p-open');
  render();
}
function agendarRetorno(c,q){
  let quando;
  if(q==='1h') quando='hoje às '+hm(MIN+60,'h');
  else if(q==='16') quando='hoje às 16h00';
  else if(q==='am') quando='amanhã às 9h00';
  else { const v=$('#retQuando')&&$('#retQuando').value; if(!v){toast('Escolha o dia e a hora do retorno');return;} const p=v.split('T'); quando='em '+p[0].slice(8,10)+'/'+p[0].slice(5,7)+' às '+p[1].replace(':','h'); }
  const n=$('#retNota'); c.retorno={q:quando,nota:n?n.value.trim():''};
  if(n) n.value='';
  push(c,{f:'sys',x:'Retorno agendado para '+quando.replace(/^em /,'')+(c.retorno.nota?': '+c.retorno.nota:'')});
  S.pop=null; render(); toast('Retorno agendado para '+quando.replace(/^em /,''));
}
function enviar(txt){
  const c=cur(); if(!c||!txt) return;
  if(S.nota){ c.notas.push({by:EU[S.eu],x:txt,t:hora()}); push(c,{f:'nota',by:EU[S.eu],x:txt,t:hora()}); }
  else { push(c,{f:'out',by:EU[S.eu],x:txt,t:hora(),tick:'entregue'}); if(c.st==='aguarda'&&SET[c.q].quem===EU[S.eu]) c.st='aberta'; c.sug=null; }
  S.draft=''; S.pop=null; render();
}
const focaMsg=()=>{const i=$('#msg'); if(i) i.focus();};

document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');
  if(!b){
    if(S.pop&&!e.target.closest('.pop')&&e.target.id!=='msg'){S.pop=null;renderChat();}
    if(S.menu&&!e.target.closest('.pop')){S.menu=false;renderMenu();}
    return;
  }
  const a=b.dataset.act, c=cur(), eu=EU[S.eu];
  if(TICA[a]) MIN++;
  if(a!=='menu'&&a!=='eu'&&S.menu){S.menu=false;renderMenu();}
  switch(a){
    case 'menu': S.menu=!S.menu; renderMenu(); break;
    case 'eu': S.eu=b.dataset.e; S.f=S.eu==='rec'?'todas':S.eu; S.menu=false; S.pop=null; marcaAberto(c); render(); toast(S.eu==='rec'?'Você está vendo a central como a Recepção':'Você está vendo a central como '+SET[S.eu].art+' '+EU[S.eu]); break;
    case 'filtro': S.f=b.dataset.f; renderChips(); renderLista(); break;
    case 'abrir': abrir(b.dataset.id); break;

    case 'painel': $('#wa').classList.toggle('p-open'); break;

    case 'ac': S.ac=S.ac===b.dataset.k?null:b.dataset.k; renderPainel(); break;
    case 'transf': transferir(c,b.dataset.q); break;
    case 'ret': agendarRetorno(c,b.dataset.q); break;
    case 'retok': c.retorno=null; push(c,{f:'sys',x:'Retorno feito por '+eu}); render(); toast('Retorno marcado como feito'); break;
    case 'retx': c.retorno=null; render(); toast('Retorno removido'); break;
    case 'encerrar': c.st='fim'; c.sug=null; c.busy=false; S.pop=null; push(c,{f:'sys',x:'Atendimento encerrado por '+eu}); render(); toast('Atendimento encerrado'); break;
    case 'reabrir': c.st='aberta'; c.q='rec'; push(c,{f:'sys',x:'Conversa reaberta na Recepção por '+eu}); if(S.f==='enc') S.f='todas'; render(); break;
    case 'assumir': c.st='aberta'; push(c,{f:'sys',x:eu+' assumiu a conversa'}); render(); break;
    case 'reaviso': avisar(c); render(); toast(SET[c.q].quem+' recebeu o aviso de novo'); break;
    case 'sugx': c.sug=null; renderChat(); break;
    case 'toque': if(c&&!c.busy) iaResponde(c,b.dataset.b); break;
    case 'aula': { const t=c.ficha.turmas[+b.dataset.i]; if(!t||!t.v) break; t.v--; c.ficha.prox=t.l; c.sug=null;
      push(c,{f:'out',by:eu,x:'Agendado: '+t.l+'. Um dia antes você recebe um lembrete pra confirmar presença.',t:hora(),tick:'entregue'});
      render(); toast('Aula agendada: '+t.l); break; }
    case 'via': { const p=pend(c); if(!p) break;
      push(c,{f:'out',by:eu,x:'Segue a 2ª via da mensalidade de '+p.ref+': '+brl(p.v)+', vencimento '+p.venc+'.',t:hora(),tick:'entregue',media:{k:'pdf',n:'boleto-'+p.ref.toLowerCase().replace('/','-')+'.pdf',d:'PDF, 86 KB'}});
      push(c,{f:'out',by:eu,x:'Pix copia e cola:\n'+PIX,t:hora(),tick:'entregue'});
      render(); toast('2ª via enviada na conversa'); break; }
    case 'tag': { const t=b.dataset.t, i=c.tags.indexOf(t); if(i<0) c.tags.push(t); else c.tags.splice(i,1); renderPainel(); break; }
    case 'modo': S.nota=!S.nota; S.pop=null; renderChat(); focaMsg(); break;
    case 'anexo': { const k=b.dataset.k; S.pop=null;
      if(k==='arq'){ renderChat(); $('#arqIn').click(); break; }
      push(c,k==='video'?{f:'out',by:eu,t:hora(),tick:'entregue',x:CFG.video.n,media:{k:'video',d:CFG.video.d}}:{f:'out',by:eu,t:hora(),tick:'entregue',media:{k:'pdf',n:'horarios-das-turmas.pdf',d:'PDF, 212 KB'}});
      render(); break; }
    case 'rapida': S.draft=RAPIDAS[+b.dataset.i][1]; S.pop=null; renderChat(); focaMsg(); break;
    case 'modelo': { const m=MODELOS[+b.dataset.i]; push(c,{f:'out',by:eu,modelo:true,x:m[1].replace('{nome}',pn(c)),t:hora(),tick:'entregue'}); render(); toast('Modelo enviado. A conversa reabre quando o contato responder.'); break; }
    case 'simresp': push(c,{f:'in',x:'Oi! Pode falar sim',t:hora()}); c.janela=true; render(); toast('O contato respondeu: dá para escrever de novo'); break;
    case 'foto': $('#fotoIn').click(); break;

  let l=Object.keys(m).filter(k=>k!=='Outros').map(k=>[k,m[k]]).sort((a,b)=>b[1]-a[1]), o=m.Outros||0;
  l.push(['Outros',o]); return l;

function delta(at,an,un,menorMelhor,per){
  if(an==null||at==null) return '';
  const d=at-an, a=Math.abs(d), igual=un==='%'?Math.abs(an?d/an*100:0)<.5:a<.5;
  const txt=un==='%'?Math.round(Math.abs(an?d/an*100:0))+'%':un==='pp'?Math.round(a)+' pontos':fmtMin(a);
  if(igual) return '<small>igual aos '+per+' dias anteriores</small>';
  const bom=menorMelhor==null?null:(d<0)===menorMelhor;
  return '<small'+(bom==null?'':bom?' class="bom"':' class="ruim"')+'>'+(d>0?'↑ ':'↓ ')+txt+(d>0?' a mais':' a menos')+' que nos '+per+' dias anteriores</small>';
}

const TIP=$('#tip'), vr=$('#v-relatorios');
function tipMostra(m,x,y){
  TIP.textContent=''; const b=document.createElement('b'), s=document.createElement('span');
  b.textContent=m.dataset.tv; s.textContent=m.dataset.tl; TIP.appendChild(b); TIP.appendChild(s); TIP.classList.add('on');
  const w=TIP.offsetWidth, hh=TIP.offsetHeight; let l=x-w/2, t=y-hh-12;
  l=Math.max(8,Math.min(window.innerWidth-w-8,l)); if(t<8) t=y+18;
  TIP.style.left=l+'px'; TIP.style.top=t+'px';
}
const tipSome=()=>TIP.classList.remove('on');
const limpaMarca=g=>g.querySelectorAll('.mk.on').forEach(m=>m.classList.remove('on'));
function aoApontar(e){ const m=e.target.closest&&e.target.closest('.mk'); if(m&&m.dataset.tv) tipMostra(m,e.clientX,e.clientY); else tipSome(); }

vr.addEventListener('pointerleave',tipSome);
$('#rlRolo').addEventListener('scroll',tipSome,{passive:true});
vr.addEventListener('keydown',function(e){
  const g=e.target; if(!g.classList||!g.classList.contains('gx')) return;
  const ms=[].slice.call(g.querySelectorAll('.mk')); if(!ms.length) return;
  const i=ms.findIndex(m=>m.classList.contains('on')), col=+g.dataset.cols||0, k=e.key; let j;
  if(k==='ArrowRight') j=i<0?0:Math.min(ms.length-1,i+1);
  else if(k==='ArrowLeft') j=i<0?ms.length-1:Math.max(0,i-1);
  else if(k==='ArrowDown') j=i<0?0:Math.min(ms.length-1,i+(col||1));
  else if(k==='ArrowUp') j=i<0?0:Math.max(0,i-(col||1));
  else if(k==='Home') j=0; else if(k==='End') j=ms.length-1;
  else { if(k==='Escape'){ limpaMarca(g); tipSome(); } return; }
  e.preventDefault(); limpaMarca(g); ms[j].classList.add('on');
  const r=(ms[j].querySelector('.bar,.pt,i')||ms[j]).getBoundingClientRect(); tipMostra(ms[j],r.left+r.width/2,r.top);
});
vr.addEventListener('focusout',function(e){ if(e.target.classList&&e.target.classList.contains('gx')){ limpaMarca(e.target); tipSome(); } });
vr.addEventListener('click',function(e){
  const b=e.target.closest('[data-ra]'); if(!b) return;

  if(a==='per'){ R.p=+b.dataset.p; renderRel(); }
  else if(a==='set'){ R.s=b.dataset.s; renderRel(); }

      h+='<div class="bl">'+EQUIPE.map(p=>'<div class="cf"><div class="esq"><span class="av s" aria-hidden="true">'+iniciais(p.n)+'</span><div><b>'+esc(p.n)+'</b><small>'+esc(p.p)+'</small></div></div><span class="dir">'+esc(p.s)+'</span></div>').join('')+'</div>';
      h+='<div class="bl"><p class="bt">Adicionar pessoa</p><form class="ln" id="eqForm"><input class="cx" id="eqNome" type="text" placeholder="Nome" autocomplete="off" aria-label="Nome da pessoa" maxlength="30">'
        +'<select class="cx cur" id="eqSet" aria-label="Setor">'+ORD.map(k=>'<option value="'+k+'">'+SET[k].n+'</option>').join('')+'</select><button class="btn p" type="submit">Adicionar</button></form>'
        +'<p class="obs">Cada pessoa entra com o próprio login e vê as conversas do setor dela. Quem é da Recepção vê todas.</p></div>';
      break;
    case 'ia':
      h+='<div class="bl">'+cf('A IA atende o Financeiro','Desligada, a conversa transferida para o Financeiro fica com a equipe.',sw('iaFin',CFG.iaFin,'A IA atende o Financeiro'))+'</div>';
      h+='<div class="bl"><p class="bt">Primeira mensagem</p><div class="fd"><textarea class="cx" id="iaOi" rows="2" aria-label="Primeira mensagem da IA">'+esc(CFG.iaOi)+'</textarea><p class="obs">Use {nome} para o primeiro nome do contato.</p></div>'
        +'<p class="bt">Botões do menu</p><div class="fd3">'+MENU_FIN.map((b,i)=>'<div><label for="iaB'+i+'"><span>'+AC_IA[i]+'</span><span class="num" id="iaC'+i+'">'+b.length+' de 20</span></label><input class="cx" id="iaB'+i+'" data-i="'+i+'" type="text" maxlength="20" value="'+esc(b)+'"></div>').join('')+'</div>'
        +'<p class="obs">O WhatsApp aceita até 3 botões por mensagem, com no máximo 20 letras cada.</p></div>';
      h+='<div class="bl"><p class="bt">Cancelamento</p><div class="fd"><label for="iaCanc">Abordagem padrão</label><textarea class="cx" id="iaCanc" rows="3">'+esc(CFG.cancelTxt)+'</textarea></div>'
        +cf('Vídeo de explicação',esc(CFG.video.n)+(CFG.video.d?', '+esc(CFG.video.d):''),'<button class="btn" data-ca="video">Trocar vídeo</button>')
        +cf('Criar cartão no quadro Cancelamentos','Quando a IA devolve um pedido de cancelamento, o cartão nasce ligado à conversa.',sw('autoCard',CFG.autoCard,'Criar cartão no quadro Cancelamentos'))+'</div>';
      h+='<div class="bl"><p class="bt">Asaas</p>'+cf('2ª via e situação financeira','Na demonstração os boletos são fictícios. No sistema de verdade a IA consulta a conta Asaas da escola na hora.','<span class="st">sem conexão</span>')+'</div>';
      break;
    case 'rapidas':
      h+='<div class="bl">'+(RAPIDAS.length?RAPIDAS.map((r,i)=>'<div class="cf"><div><b>/'+esc(r[0])+'</b><small>'+esc(r[1])+'</small></div><button class="ib" data-ca="rap-x" data-i="'+i+'" aria-label="Remover /'+esc(r[0])+'">'+ic('x')+'</button></div>').join(''):'<p class="obs" style="padding-top:10px">Nenhuma resposta rápida. Crie a primeira aqui embaixo.</p>')+'</div>';
      h+='<div class="bl"><p class="bt">Nova resposta rápida</p><form class="ln" id="rapForm"><input class="cx cur" id="rapA" type="text" placeholder="atalho" autocomplete="off" aria-label="Atalho, sem a barra" maxlength="16"><input class="cx" id="rapT" type="text" placeholder="Texto que entra na conversa" autocomplete="off" aria-label="Texto da resposta"><button class="btn p" type="submit">Adicionar</button></form>'
        +'<p class="obs">Na conversa, digite a barra e o atalho. Exemplo: /remarcar</p></div>';
      break;
    case 'etiquetas':
      h+='<div class="bl">'+ETIQ.map((t,i)=>'<div class="cf"><div class="esq">'+lbp(t)+'</div><div class="esq"><select class="cx" data-ca-cor="'+i+'" aria-label="Cor de '+esc(t)+'" style="width:auto">'+CORES.map(c=>'<option value="'+c[0]+'"'+(COR_ETQ[t]===c[0]?' selected':'')+'>'+c[1]+'</option>').join('')+'</select><button class="ib" data-ca="etq-x" data-i="'+i+'" aria-label="Remover '+esc(t)+'">'+ic('x')+'</button></div></div>').join('')+'</div>';
      h+='<div class="bl"><p class="bt">Nova etiqueta</p><form class="ln" id="etqForm"><input class="cx" id="etqN" type="text" placeholder="Nome da etiqueta" autocomplete="off" aria-label="Nome da etiqueta" maxlength="18"><select class="cx cur" id="etqC" aria-label="Cor">'+CORES.map(c=>'<option value="'+c[0]+'">'+c[1]+'</option>').join('')+'</select><button class="btn p" type="submit">Adicionar</button></form>'
        +'<p class="obs">A mesma etiqueta marca a conversa e o cartão do quadro, e entra nos motivos de contato dos relatórios.</p></div>';
      break;
    case 'horario':
      h+='<div class="bl">'+CFG.horario.map((x,i)=>'<div class="hr"><b>'+x.n+'</b>'+(x.on?'<input class="cx" type="time" data-ca-h="'+i+'" data-c="de" value="'+x.de+'" aria-label="'+x.n+', abre às"><span>até</span><input class="cx" type="time" data-ca-h="'+i+'" data-c="ate" value="'+x.ate+'" aria-label="'+x.n+', fecha às">':'<span style="flex:1 1 120px">fechado</span>')+sw('h-'+i,x.on,'Atende '+x.n)+'</div>').join('')+'</div>';
      h+='<div class="bl">'+cf('Mensagem de ausência','Responde sozinha quem escreve fora do horário.',sw('ausencia',CFG.ausencia,'Mensagem de ausência'))
        +(CFG.ausencia?'<div class="fd"><textarea class="cx" id="ausTxt" rows="3" aria-label="Texto da mensagem de ausência">'+esc(CFG.ausTxt)+'</textarea></div>':'')+'</div>';
      break;
    case 'whatsapp':
      h+='<div class="bl"><dl class="kv"><dt>Número da escola</dt><dd class="num">+55 49 90000-0100</dd><dt>Conta</dt><dd>API oficial do WhatsApp</dd><dt>Situação</dt><dd>demonstração, sem conexão</dd></dl>'
        +'<p class="obs">Com a API oficial, depois de 24 horas sem mensagem do contato só dá para escrever por modelo aprovado. A foto de perfil do contato não vem pela API: a foto que aparece aqui é a do cadastro do aluno.</p></div>';
      h+='<div class="bl"><p class="bt">Modelos de mensagem</p>'+MODELOS.map(m=>[m[0],m[1],'aprovado']).concat(MOD_EXTRA).map(m=>'<div class="cf"><div><b>'+esc(m[0])+'</b><small>'+esc(m[1])+'</small></div><span class="st'+(m[2]==='aprovado'?' ok':'')+'">'+m[2]+'</span></div>').join('')
        +'<p class="obs">Modelo novo passa pela aprovação da Meta antes de poder ser usado.</p></div>';
      break;
    case 'aparencia':
      h+='<div class="bl"><p class="bt">Tema</p><div class="tms">'
        +[['claro','','Claro','Fundo branco, para o dia a dia'],['escuro','e','Escuro','Fundo escuro, descansa a vista'],['auto','m','Automático','Acompanha o aparelho']].map(t=>'<button class="tm" data-ca="tema" data-t="'+t[0]+'" aria-pressed="'+(TEMA===t[0])+'"><span class="pv '+t[1]+'" aria-hidden="true"><i class="a"></i><i class="b"></i></span><span><b>'+t[2]+'</b><small>'+t[3]+'</small></span></button>').join('')
        +'</div><p class="obs">A escolha fica guardada neste aparelho.</p></div>';
      break;
  }
  return h+'<p class="fict">Demonstração: as mudanças valem enquanto esta página estiver aberta.</p>';
}
function renderAj(){
  const v=$('#v-configuracoes'), fc=guardaFoco(v);
  $('#ajNav').innerHTML=SECS.map(s=>'<button class="sn" data-ca="sec" data-s="'+s[0]+'" aria-current="'+(A.s===s[0])+'"><span class="ico">'+ic(s[1])+'</span><span class="bd"><b>'+s[2]+'</b><small>'+s[3]+'</small></span></button>').join('');
  const s=SECS.find(x=>x[0]===A.s), b=$('#ajB'), topo=b?b.scrollTop:0;
  $('#ajC').innerHTML='<header class="ch"><button class="ib volta" data-ca="voltar" aria-label="Voltar para as configurações">'+ic('volta')+'</button><b>'+s[2]+'</b></header><div class="aj-b" id="ajB">'+secaoHTML()+'</div>';
  $('#ajB').scrollTop=topo;
  devolveFoco(v,fc);
}
const va=$('#v-configuracoes');
va.addEventListener('click',function(e){
  const b=e.target.closest('[data-ca]'); if(!b) return;
  const a=b.dataset.ca;
  switch(a){
    case 'sec': A.s=b.dataset.s; $('#aj').classList.add('ab'); renderAj(); $('#ajB').scrollTop=0; break;
    case 'voltar': $('#aj').classList.remove('ab'); break;
    case 'sw': { const k=b.dataset.k;
      if(k.indexOf('av-')===0){ const s=SET[k.slice(3)]; s.avisa=!s.avisa; toast(s.avisa?s.quem+' volta a receber o aviso no WhatsApp':s.quem+' não recebe mais o aviso no WhatsApp'); }
      else if(k.indexOf('h-')===0){ const x=CFG.horario[+k.slice(2)]; x.on=!x.on; }
      else { CFG[k]=!CFG[k];
        if(k==='iaFin') toast(CFG.iaFin?'A IA volta a atender o Financeiro':'O Financeiro fica com a equipe');
        else if(k==='direto') toast(CFG.direto?'Vale para as próximas conversas que chegarem':'Tudo volta a passar pela Recepção'); }
      renderAj(); break; }
    case 'video': $('#videoIn').click(); break;
    case 'rap-x': RAPIDAS.splice(+b.dataset.i,1); renderAj(); break;
    case 'etq-x': { const t=ETIQ[+b.dataset.i]; ETIQ.splice(+b.dataset.i,1); delete COR_ETQ[t];
      CONVS.forEach(c=>{ const i=c.tags.indexOf(t); if(i>=0) c.tags.splice(i,1); });
      QD.forEach(q=>q.ls.forEach(l=>l.cs.forEach(k=>{ const i=k.lb.indexOf(t); if(i>=0) k.lb.splice(i,1); })));
      Q.fl.lb=Q.fl.lb.filter(x=>x!==t); renderAj(); toast('Etiqueta '+t+' removida das conversas e dos cartões'); break; }
    case 'tema': TEMA=b.dataset.t; aplicaTema(true); renderAj(); break;
  }
});
va.addEventListener('submit',function(e){
  const id=e.target.id;
  if(id==='eqForm'){ const n=$('#eqNome').value.trim(), s=$('#eqSet').value; if(!n){ toast('Escreva o nome da pessoa'); return; }
    EQUIPE.push({id:'p'+(++KID),n:n,p:s==='rec'||s==='fin'?'Atendimento':'Coordenação',s:SET[s].n}); $('#eqNome').value=''; renderAj(); toast(n+' entrou na equipe'); }
  else if(id==='rapForm'){ const a=$('#rapA').value.trim().toLowerCase().replace(/^\/+/,'').replace(/\s+/g,''), t=$('#rapT').value.trim();
    if(!a||!t){ toast('Preencha o atalho e o texto'); return; } if(RAPIDAS.some(r=>r[0]===a)){ toast('Já existe uma resposta com o atalho /'+a); return; }
    RAPIDAS.push([a,t]); $('#rapA').value=''; $('#rapT').value=''; renderAj(); toast('Resposta /'+a+' criada'); }
  else if(id==='etqForm'){ const n=$('#etqN').value.trim(); if(!n){ toast('Escreva o nome da etiqueta'); return; } if(ETIQ.some(t=>t.toLowerCase()===n.toLowerCase())){ toast('Essa etiqueta já existe'); return; }
    ETIQ.push(n); COR_ETQ[n]=$('#etqC').value; $('#etqN').value=''; renderAj(); toast('Etiqueta '+n+' criada'); }
});
va.addEventListener('input',function(e){
  const t=e.target, id=t.id;
  if(id==='iaOi') CFG.iaOi=t.value;
  else if(id==='iaCanc') CFG.cancelTxt=t.value;
  else if(id==='ausTxt') CFG.ausTxt=t.value;
  else if(/^iaB\d$/.test(id)){ const i=+t.dataset.i, v=t.value.trim(); if(v) MENU_FIN[i]=v; $('#iaC'+i).textContent=t.value.length+' de 20'; }
});
va.addEventListener('change',function(e){
  const t=e.target;
  if(t.dataset.caCor!=null){ COR_ETQ[ETIQ[+t.dataset.caCor]]=t.value; renderAj(); }
  else if(t.dataset.caH!=null){ CFG.horario[+t.dataset.caH][t.dataset.c]=t.value; }
  else if(/^iaB\d$/.test(t.id)&&!t.value.trim()){ t.value=MENU_FIN[+t.dataset.i]; $('#iaC'+t.dataset.i).textContent=t.value.length+' de 20'; }
});
$('#videoIn').addEventListener('change',function(e){
  const f=e.target.files[0]; if(!f) return;
  CFG.video={n:f.name.replace(/\.[^.]+$/,''),d:''}; e.target.value=''; renderAj(); toast('Vídeo trocado. A IA passa a enviar este.');
});

/* ================= casca: seções e tema ================= */
const VIEWS=['conversas','quadros','relatorios','configuracoes'];
let V='conversas';
function ir(v,semHash){
  if(VIEWS.indexOf(v)<0) v='conversas';
  V=v; tipSome();
  VIEWS.forEach(k=>{ $('#v-'+k).hidden=k!==v; });
  document.querySelectorAll('[data-nav]').forEach(b=>{ if(b.dataset.nav===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(v==='quadros') renderQuadros(); else if(v==='relatorios') renderRel(); else if(v==='configuracoes') renderAj(); else render();
  if(!semHash){ try{ if(location.hash!=='#'+v) location.hash=v; }catch(e){} }
}
function abrirConversa(id){
  const c=CONVS.find(x=>x.id===id); if(!c) return;
  Q.card=null; S.f=c.st==='fim'?'enc':'todas'; S.q=''; $('#q').value='';
  ir('conversas'); abrir(id);
}
let TEMA='auto';
try{ const t=localStorage.getItem('nexus-tema'); if(t==='claro'||t==='escuro') TEMA=t; }catch(e){}
const mqEscuro=window.matchMedia('(prefers-color-scheme: dark)');
function escuroAgora(){
  if(TEMA!=='auto') return TEMA==='escuro';
  const d=document.documentElement.getAttribute('data-theme');
  return d?d==='dark':mqEscuro.matches;
}
function aplicaTema(guardar){
  document.body.classList.toggle('t-claro',TEMA==='claro');
  document.body.classList.toggle('t-escuro',TEMA==='escuro');
  const e=escuroAgora(), b=$('#temaBtn'), rot=e?'Mudar para o tema claro':'Mudar para o tema escuro';
  b.title=rot; b.setAttribute('aria-label',rot); b.innerHTML=ic(e?'sol':'lua');
  if(guardar){ try{ if(TEMA==='auto') localStorage.removeItem('nexus-tema'); else localStorage.setItem('nexus-tema',TEMA); }catch(err){} }
}
if(mqEscuro.addEventListener) mqEscuro.addEventListener('change',()=>aplicaTema(false));
document.addEventListener('click',function(e){
  const n=e.target.closest('[data-nav]');
  if(n){ /* no celular, tocar na aba volta para a lista daquela seção */
    if(n.dataset.nav==='configuracoes') $('#aj').classList.remove('ab');
    if(n.dataset.nav==='conversas'&&estreito.matches){ $('#wa').classList.remove('c-open','p-open'); S.conv=null; }
    ir(n.dataset.nav); return; }
  if(e.target.closest('#temaBtn')){ TEMA=escuroAgora()?'claro':'escuro'; aplicaTema(true); if(V==='configuracoes') renderAj(); toast(TEMA==='escuro'?'Tema escuro ligado':'Tema claro ligado'); }
});
window.addEventListener('hashchange',function(){ const h=location.hash.slice(1); if(h&&h!==V&&VIEWS.indexOf(h)>=0) ir(h,true); });
let tRz;
window.addEventListener('resize',function(){ clearTimeout(tRz); tRz=setTimeout(function(){ if(V==='relatorios') renderRel(); },160); });

aplicaTema(false);
if(!estreito.matches){ S.conv='eduardo'; cur().unread=0; }
render();
{ const h=location.hash.slice(1); ir(VIEWS.indexOf(h)>=0?h:'conversas',true); }
})();
</script>
